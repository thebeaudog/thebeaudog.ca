<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" type="image/png" href="{{ '/assets/img/favicon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/img/logo-600.png' | relative_url }}" alt="" width="44" height="45">
      <span>The Beau Dog</span>
    </a>

    <details class="menu">
      <summary>Menu</summary>
      <nav aria-label="Main">
        <ul>
          {% for item in site.data.nav %}
          <li><a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
          {% endfor %}
        </ul>
      </nav>
    </details>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>
      <a href="mailto:{{ site.email }}">{{ site.email }}</a> &middot;
      <a href="tel:+1{{ site.phone_digits }}">{{ site.phone_display }}</a>
    </p>
    <p>
      <a href="{{ site.facebook }}">Facebook</a> &middot;
      <a href="{{ site.instagram }}">Instagram</a>
    </p>
    <p class="small">&copy; {{ 'now' | date: "%Y" }} The Beau Dog Grooming Salon &middot; Fireside, Cochrane, AB</p>
  </footer>
</body>
</html>
